<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../css/style.css">

    <title>Система бонусов и лояльности</title>
    
    <!-- Favicon чтобы убрать 404 ошибку -->
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎯</text></svg>" type="image/svg+xml">
</head>
<body>
    <div class="container">
        <h1>📊 Система бонусов и лояльности</h1>
        <div class="stats">
            <div class="stat-card">
                <div class="stat-number" id="totalUsers"></div>
                <div class="stat-label">Всего пользователей</div>
            </div>
            <div class="stat-card">
                <div class="stat-number" id="totalBonuses"></div>
                <div class="stat-label">Всего бонусов</div>
            </div>
            <div class="stat-card">
                <div class="stat-number" id="avgBonuses"></div>
                <div class="stat-label">Среднее бонусов</div>
            </div>
        </div>
        
        <h2>👤 Создание нового пользователя</h2>
        <form id="userForm">
            <div class="form-group">
                <label for="name">ФИО пользователя:</label>
                <input type="text" id="name" name="name" placeholder="Введите ФИО" required>
            </div>
            
            <div class="form-group">
                <label for="email">Email:</label>
                <input type="email" id="email" name="email" placeholder="example@mail.ru" required>
            </div>
            
            <div class="form-group">
                <label for="phone">Телефон:</label>
                <input type="tel" id="phone" name="phone" placeholder="+79161234567">
            </div>
            
            <div class="form-group">
                <label for="initialBonus">Начальные бонусные баллы:</label>
                <input type="number" id="initialBonus" name="initialBonus" value="0" min="0">
            </div>
            
            <button type="submit">✅ Создать пользователя</button>
            <button type="button" onclick="loadUsers()">🔄 Обновить список</button>
        </form>
        
        <div id="result" class="result"></div>
    </div>

    <div class="container">
        <div style="display: flex; justify-content: space-between; align-items: center;">
            <h2>📋 Список пользователей</h2>
            <button onclick="loadUsers()">🔄 Обновить</button>
        </div>
        <div id="userList" class="user-list">
            <div class="loading">Загрузка пользователей...</div>
        </div>
    </div>
    <!-- Модальное окно для редактирования пользователя -->
    <div id="editUserModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h3 class="modal-title">✏️ Редактировать пользователя</h3>
                <span class="close" onclick="closeEditModal()">&times;</span>
            </div>
            <form id="editUserForm">
                <input type="hidden" id="editUserId">
                <div class="form-group">
                    <label for="editUserName">ФИО пользователя:</label>
                    <input type="text" id="editUserName" value="username" placeholder="Введите ФИО" required>
                </div>
                
                <div class="form-group">
                    <label for="editUserEmail">Email:</label>
                    <input type="email" id="editUserEmail" Username="email" placeholder="example@mail.ru" required>
                </div>
                
                <div class="form-group">
                    <label for="editUserPhone">Телефон:</label>
                    <input type="tel" id="editUserPhone" Username="phone" placeholder="+79161234567">
                </div>
                
                <div class="form-group">
                    <label for="editUserBonusPoints">Бонусные баллы:</label>
                    <input type="number" id="editUserBonusPoints" Username="bonusPoints" value="0" min="0">
                </div>

                <div class="form-group">
                    <label for="editUserGroup">Группа пользователя:</label>
                    <select id="editUserGroup" Username="userGroup">
                        <option value="">Выберите группу</option>
                        <option value="NEW">NEW - Новый пользователь</option>
                        <option value="REGULAR">REGULAR - Постоянный клиент</option>
                        <option value="VIP">VIP - VIP клиент</option>
                        <option value="PREMIUM">PREMIUM - Премиум клиент</option>
                        <option value="CORPORATE">CORPORATE - Корпоративный клиент</option>
                        <option value="TEST">TEST - Тестовый аккаунт</option>
                        <option value="ADMIN">ADMIN - Администратор</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="editUserUsername">Username:</label>
                    <input type="text" id="editUserUsername" Username="username" placeholder="Имя пользователя">
                </div>
                
                <div class="modal-actions">
                    <button type="button" class="btn-cancel" onclick="closeEditModal()">❌ Отмена</button>
                    <button type="submit" class="btn-save">💾 Сохранить изменения</button>
                </div>
            </form>
        </div>
    </div>
    
    <div class="container">
        <div class="links">
            <!-- Убираем ссылки которые могут вызывать 404 -->
            <a href="javascript:void(0)" onclick="showNotification('Swagger документация недоступна', 'error')">📚 Swagger документация</a>
            <a href="javascript:void(0)" onclick="showNotification('База данных недоступна', 'error')">🗄️ База данных H2</a>
            <a href="/api/users/" target="_blank">🏠 Главная страница API</a>
            <a href="/api/users/health" target="_blank">❤️ Проверка здоровья</a>
        </div>
    </div>
    <script src="../js/script.js"></script>
</body>
</html>
