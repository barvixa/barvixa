<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../css/style.css">
    <title>Система бонусов и лояльности</title>
    
    <!-- Favicon чтобы убрать 404 ошибку -->
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎯</text></svg>" type="image/svg+xml">
</head>
<body>
    <div class="container">
        <h1>📊 Система бонусов и лояльности</h1>
        <div class="stats">
            <div class="stat-card">
                <div class="stat-number" id="totalUsers"></div>
                <div class="stat-label">Всего пользователей</div>
            </div>
            <div class="stat-card">
                <div class="stat-number" id="totalBonuses"></div>
                <div class="stat-label">Всего бонусов</div>
            </div>
            <div class="stat-card">
                <div class="stat-number" id="avgBonuses"></div>
                <div class="stat-label">Среднее бонусов</div>
            </div>
        </div>
        
        <h2>👤 Создание нового пользователя</h2>
        <form id="userForm">
            <div class="form-group">
                <label for="name">ФИО пользователя:</label>
                <input type="text" id="name" name="name" placeholder="Введите ФИО" required>
            </div>
            
            <div class="form-group">
                <label for="email">Email:</label>
                <input type="email" id="email" name="email" placeholder="example@mail.ru" required>
            </div>
            
            <div class="form-group">
                <label for="phone">Телефон:</label>
                <input type="tel" id="phone" name="phone" placeholder="+79161234567">
            </div>
            
            <div class="form-group">
                <label for="initialBonus">Начальные бонусные баллы:</label>
                <input type="number" id="initialBonus" name="initialBonus" value="0" min="0">
            </div>
            
            <button type="submit">✅ Создать пользователя</button>
            <button type="button" onclick="loadUsers()">🔄 Обновить список</button>
        </form>
        
        <div id="result" class="result"></div>
    </div>

    <div class="container">
        <div style="display: flex; justify-content: space-between; align-items: center;">
            <h2>📋 Список пользователей</h2>
            <button onclick="loadUsers()">🔄 Обновить</button>
        </div>
        <div id="userList" class="user-list">
            <div class="loading">Загрузка пользователей...</div>
        </div>
    </div>
    <!-- Модальное окно для редактирования пользователя -->
    <div id="editUserModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h3 class="modal-title">✏️ Редактировать пользователя</h3>
                <span class="close" onclick="closeEditModal()">&times;</span>
            </div>
            <form id="editUserForm">
                <input type="hidden" id="editUserId">
                <div class="form-group">
                    <label for="editUserName">ФИО пользователя:</label>
                    <input type="text" id="editUserName" value="username" placeholder="Введите ФИО" required>
                </div>
                
                <div class="form-group">
                    <label for="editUserEmail">Email:</label>
                    <input type="email" id="editUserEmail" Username="email" placeholder="example@mail.ru" required>
                </div>
                
                <div class="form-group">
                    <label for="editUserPhone">Телефон:</label>
                    <input type="tel" id="editUserPhone" Username="phone" placeholder="+79161234567">
                </div>
                
                <div class="form-group">
                    <label for="editUserBonusPoints">Бонусные баллы:</label>
                    <input type="number" id="editUserBonusPoints" Username="bonusPoints" value="0" min="0">
                </div>

                <div class="form-group">
                    <label for="editUserGroup">Группа пользователя:</label>
                    <select id="editUserGroup" Username="userGroup">
                        <option value="">Выберите группу</option>
                        <option value="NEW">NEW - Новый пользователь</option>
                        <option value="REGULAR">REGULAR - Постоянный клиент</option>
                        <option value="VIP">VIP - VIP клиент</option>
                        <option value="PREMIUM">PREMIUM - Премиум клиент</option>
                        <option value="CORPORATE">CORPORATE - Корпоративный клиент</option>
                        <option value="TEST">TEST - Тестовый аккаунт</option>
                        <option value="ADMIN">ADMIN - Администратор</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="editUserUsername">Username:</label>
                    <input type="text" id="editUserUsername" Username="username" placeholder="Имя пользователя">
                </div>
                
                <div class="modal-actions">
                    <button type="button" class="btn-cancel" onclick="closeEditModal()">❌ Отмена</button>
                    <button type="submit" class="btn-save">💾 Сохранить изменения</button>
                </div>
            </form>
        </div>
    </div>
    
    <div class="container">
        <div class="links">
            <!-- Убираем ссылки которые могут вызывать 404 -->
            <a href="javascript:void(0)" onclick="showNotification('Swagger документация недоступна', 'error')">📚 Swagger документация</a>
            <a href="javascript:void(0)" onclick="showNotification('База данных недоступна', 'error')">🗄️ База данных H2</a>
            <a href="/api/users/" target="_blank">🏠 Главная страница API</a>
            <a href="/api/users/health" target="_blank">❤️ Проверка здоровья</a>
        </div>
    </div>

    <script>
        // Глобальная переменная для хранения текущего списка пользователей
        let currentUsers = [];
        let currentEditingUserId = null;

        // Загружаем пользователей при загрузке страницы
        document.addEventListener('DOMContentLoaded', function() {
            loadUsers();
            // Обновляем список каждые 30 секунд
            setInterval(loadUsers, 30000);

            // Обработчик формы редактирования
            document.getElementById('editUserForm').addEventListener('submit', function(e) {
                e.preventDefault();
                saveUserChanges();
            });

            // Закрытие модального окна при клике вне его
            document.getElementById('editUserModal').addEventListener('click', function(e) {
                if (e.target === this) {
                    closeEditModal();
                }
            });

            // Закрытие модального окна по ESC
            document.addEventListener('keydown', function(e) {
                if (e.key === 'Escape') {
                    closeEditModal();
                }
            });
        });

        // Функция открытия модального окна редактирования
        function openEditModal(userId) {
            const user = currentUsers.find(u => u.id === userId);
            if (!user) {
                showNotification('❌ Пользователь не найден', 'error');
                return;
            }

            currentEditingUserId = userId;

            // Заполняем форму данными пользователя
            document.getElementById('editUserId').value = userId;
            document.getElementById('editUserName').value = user.username || '';
            document.getElementById('editUserEmail').value = user.email || '';
            document.getElementById('editUserPhone').value = user.phone || '';
            document.getElementById('editUserBonusPoints').value = user.bonusPoints || 0;
            document.getElementById('editUserGroup').value = user.userGroup || '';
            document.getElementById('editUserUsername').value = user.username || '';

            // Показываем модальное окно
            document.getElementById('editUserModal').style.display = 'block';
            document.body.style.overflow = 'hidden';
        }

        // Функция закрытия модального окна
        function closeEditModal() {
            document.getElementById('editUserModal').style.display = 'none';
            document.body.style.overflow = 'auto';
            currentEditingUserId = null;
        }

        // Функция сохранения изменений пользователя
        async function saveUserChanges() {
            if (!currentEditingUserId) return;

            const formData = {
                name: document.getElementById('editUserName').value,
                email: document.getElementById('editUserEmail').value,
                phone: document.getElementById('editUserPhone').value,
                bonusPoints: parseInt(document.getElementById('editUserBonusPoints').value),
                userGroup: document.getElementById('editUserGroup').value,
                username: document.getElementById('editUserUsername').value
            };

            try {
                const response = await fetch(`/api/users/update/${currentEditingUserId}`, {
                    method: 'PUT',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify(formData)
                });
                
                const result = await response.json();
                
                if (result.success) {
                    showNotification('✅ ' + result.message, 'success');
                    closeEditModal();
                    await loadUsers();
                } else {
                    showNotification('❌ ' + result.message, 'error');
                }
            } catch (error) {
                showNotification('❌ Ошибка при обновлении пользователя: ' + error.message, 'error');
            }
        }

        // Новая функция для получения данных с бекенда
        async function getBackendData() {
            try {
                // Показываем индикатор загрузки
                const dataDisplay = document.getElementById('backendData');
                const dataContent = document.getElementById('dataContent');
                dataContent.innerHTML = '<div class="loading">Загрузка данных...</div>';
                dataDisplay.style.display = 'block';

                // Получаем данные с бекенда
                const response = await fetch('/api/users/all');
                
                if (!response.ok) {
                    throw new Error(`Ошибка HTTP: ${response.status}`);
                }
                
                const data = await response.json();
                
                // Отображаем полученные данные
                if (data && data.length > 0) {
                    dataContent.innerHTML = data.map(user => `
                        <div class="data-item">
                            <strong>👤 ${user.username || 'Не указано'}</strong><br>
                            📧 Email: ${user.email || 'Не указан'}<br>
                            📞 Телефон: ${user.phone || 'Не указан'}<br>
                            ⭐ Бонусы: ${user.bonusPoints || 0}<br>
                            📅 Регистрация: ${user.registrationDate ? formatDate(user.registrationDate) : 'Не указана'}
                        </div>
                    `).join('');
                    
                    showNotification('✅ Данные успешно получены с бекенда!', 'success');
                } else {
                    dataContent.innerHTML = '<div class="empty-state">Нет данных для отображения</div>';
                }
                
            } catch (error) {
                const dataContent = document.getElementById('dataContent');
                dataContent.innerHTML = `
                    <div class="result error">
                        ❌ Ошибка при получении данных: ${error.message}
                    </div>
                `;
                showNotification('❌ Ошибка при получении данных', 'error');
            }
        }

        // Обработчик формы создания пользователя
        document.getElementById('userForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const formData = {
                name: document.getElementById('name').value,
                email: document.getElementById('email').value,
                phone: document.getElementById('phone').value,
                initialBonus: parseInt(document.getElementById('initialBonus').value)
            };
            
            try {
                const response = await fetch('/api/users/create', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify(formData)
                });
                
                const result = await response.json();
                const resultDiv = document.getElementById('result');
                
                if (result.success) {
                    resultDiv.className = 'result success';
                    resultDiv.innerHTML = `
                        <strong>✅ Успех!</strong><br>
                        ${result.message}
                    `;
                    // Очищаем форму после успешного создания
                    document.getElementById('userForm').reset();
                    // Динамически обновляем список пользователей
                    await loadUsers(true);
                } else {
                    resultDiv.className = 'result error';
                    resultDiv.innerHTML = `
                        <strong>❌ Ошибка!</strong><br>
                        ${result.message}
                    `;
                }
                
                resultDiv.style.display = 'block';
                
                // Скрываем сообщение через 5 секунд
                setTimeout(() => {
                    resultDiv.style.display = 'none';
                }, 5000);
                
            } catch (error) {
                const resultDiv = document.getElementById('result');
                resultDiv.className = 'result error';
                resultDiv.innerHTML = `
                    <strong>❌ Ошибка соединения!</strong><br>
                    Не удалось подключиться к серверу. Проверьте, запущено ли приложение.
                `;
                resultDiv.style.display = 'block';
            }
        });

        // Функция загрузки списка пользователей
        async function loadUsers(highlightNew = false) {
            try {
                document.getElementById('userList').innerHTML = '<div class="loading">Загрузка пользователей...</div>';
                
                const response = await fetch('/api/users/all');
                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }
                const users = await response.json();
                console.log('Полученные данные:', users);
                
                currentUsers = users;
                updateStatistics(users);
                renderUserList(users, highlightNew);
                
            } catch (error) {
                console.error('Ошибка при загрузке пользователей:', error);
                document.getElementById('userList').innerHTML = `
                    <div class="result error">
                        ❌ Ошибка при загрузке пользователей: ${error.message}
                    </div>
                `;
            }
        }

        // Функция отрисовки списка пользователей
        function renderUserList(users, highlightNew = false) {
            const userListDiv = document.getElementById('userList');
            
            if (users.length === 0) {
                userListDiv.innerHTML = `
                    <div class="empty-state">
                        <h3>😔 Пользователи не найдены</h3>
                        <p>Создайте первого пользователя с помощью формы выше</p>
                    </div>
                `;
                return;
            }
            
            users.sort((a, b) => new Date(b.registrationDate || 0) - new Date(a.registrationDate || 0));
            
            userListDiv.innerHTML = users.map((user, index) => {
                const isNew = highlightNew && index === 0;
                
                const userName = user.username || 'Не указано';
                const userEmail = user.email || 'Не указан';
                const userPhone = user.phone || 'Не указан';
                const userBonusPoints = user.bonusPoints || 0;
                const userId = user.id || 'N/A';
                const userUserId = user.userId || user.id || 'N/A';
                const userBonusBalance = user.bonusBalance || user.bonusPoints || 0;
                const userUserGroup = user.userGroup || 'Не указана';
                const safeName = userName ? userName.replace(/'/g, "\\'") : '';
                
                return `
                    <div class="user-card ${isNew ? 'new-user' : ''}" id="user-${userId}">
                        <div class="user-info">
                            <div class="user-field">
                                <strong>Bonus Balance:</strong>
                                <div class="user-value">${userBonusBalance}</div>
                            </div>
                            <div class="user-field">
                                <strong>User Group:</strong>
                                <div class="user-value">${userUserGroup}</div>
                            </div>
                            <div class="user-field">
                                <strong>ФИО:</strong>
                                <div class="user-value">${userName}</div>
                            </div>
                            <div class="user-field">
                                <strong>Email:</strong>
                                <div class="user-value">${userEmail}</div>
                            </div>
                            <div class="user-field">
                                <strong>Телефон:</strong>
                                <div class="user-value">${userPhone}</div>
                            </div>
                            <div class="user-field">
                                <strong>Бонусы:</strong>
                                <div class="user-value">${userBonusPoints}</div>
                            </div>
                            <div class="user-field">
                                <strong>Дата регистрации:</strong>
                                <div class="user-value">${formatDate(user.registrationDate)}</div>
                            </div>
                        </div>
                        <div class="user-actions">
                            <button class="edit" onclick="openEditModal(${userId})">
                                ✏️ Редактировать
                            </button>
                            <button class="delete" onclick="deleteUser(${userId}, '${safeName}')">
                                🗑️ Удалить
                            </button>
                        </div>
                    </div>
                `;
            }).join('');
        }

        // Функция обновления статистики
function updateStatistics() {
    // Делаем параллельные запросы
    Promise.all([
        fetch('/api/users/all').then(r => r.json()),
        fetch('/api/users/bonuses/total').then(r => r.json())
    ])
    .then(([usersData, totalBonuses]) => {
        console.log('Данные пользователей:', usersData);
        console.log('Общая сумма бонусов:', totalBonuses);
        
        // Обрабатываем массив пользователей
        let usersArray = [];
        if (Array.isArray(usersData)) {
            usersArray = usersData;
        } else if (usersData && Array.isArray(usersData.content)) {
            usersArray = usersData.content;
        } else if (usersData && Array.isArray(usersData.users)) {
            usersArray = usersData.users;
        } else if (usersData && typeof usersData === 'object') {
            usersArray = [usersData];
        }
        
        const totalUsers = usersArray.length;
        
        // Преобразуем totalBonuses в число
        const totalBonusesValue = parseFloat(totalBonuses) || 0;
        
        // Считаем средние бонусы
        const avgBonuses = totalUsers > 0 ? (totalBonusesValue / totalUsers).toFixed(2) : '0.00';
        
        // Обновляем DOM
        document.getElementById('totalUsers').textContent = totalUsers;
        document.getElementById('totalBonuses').textContent = totalBonusesValue.toFixed(2);
        document.getElementById('avgBonuses').textContent = avgBonuses;
        
    })
    .catch(error => {
        console.error('Ошибка:', error);
        document.getElementById('totalUsers').textContent = '0';
        document.getElementById('totalBonuses').textContent = '0.00';
        document.getElementById('avgBonuses').textContent = '0.00';
    });
}
        // Функция форматирования даты
        function formatDate(dateString) {
            if (!dateString) return 'Не указана';
            const date = new Date(dateString);
            return date.toLocaleString('ru-RU', {
                year: 'numeric',
                month: '2-digit',
                day: '2-digit',
                hour: '2-digit',
                minute: '2-digit'
            });
        }

        // Функция для удаления пользователя
        async function deleteUser(userId, userName) {
            const displayName = userName || 'этого пользователя';
            if (confirm(`Вы уверены, что хотите удалить пользователя "${displayName}"?`)) {
                try {
                    const response = await fetch(`/api/users/delete/${userId}`, {
                        method: 'DELETE'
                    });
                    
                    const result = await response.json();
                    
                    if (result.success) {
                        showNotification('✅ ' + result.message, 'success');
                        const userCard = document.getElementById(`user-${userId}`);
                        if (userCard) {
                            userCard.style.opacity = '0';
                            userCard.style.transform = 'translateX(-100%)';
                            setTimeout(() => loadUsers(), 300);
                        } else {
                            await loadUsers();
                        }
                    } else {
                        showNotification('❌ ' + result.message, 'error');
                    }
                } catch (error) {
                    showNotification('❌ Ошибка при удалении пользователя: ' + error.message, 'error');
                }
            }
        }
        
        // Функция показа уведомлений
        function showNotification(message, type) {
            const notification = document.createElement('div');
            notification.className = `result ${type}`;
            notification.innerHTML = message;
            notification.style.position = 'fixed';
            notification.style.top = '20px';
            notification.style.right = '20px';
            notification.style.zIndex = '1000';
            notification.style.maxWidth = '300px';
            
            document.body.appendChild(notification);
            
            setTimeout(() => {
                notification.remove();
            }, 3000);
        }
    </script>
</body>
</html>
